<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المتصدرات – مِضمار</title><link rel="stylesheet" href="/style.css">
<style>body{background:#0B2B22;color:#fff;overflow-x:hidden}.hd{display:flex;gap:1em;align-items:center;padding:1em 2vw;flex-wrap:wrap}.hd h1{margin:0;font-size:clamp(1.6rem,3.4vw,3rem)}
.hd .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}.st{display:flex;gap:2em;padding:0 2vw;font-size:clamp(1rem,1.8vw,1.6rem);color:#BFE3D5}
.podium{display:flex;gap:1.2vw;justify-content:center;align-items:flex-end;padding:2vh 2vw;min-height:30vh}.pod{flex:1;max-width:30vw;border-radius:16px 16px 0 0;text-align:center;padding:1em .5em;color:#12263A}
.pod b{display:block;font-size:clamp(1.3rem,3vw,2.8rem)}.pod .sc{font-size:clamp(1.6rem,4vw,3.6rem);font-weight:700}.p1{background:#F2B705;height:30vh}.p2{background:#D5DDE5;height:23vh}.p3{background:#D99A5B;height:18vh}
.lanes{padding:0 2vw 3vh;position:relative}.lane{position:absolute;inset-inline:2vw;height:7vh;min-height:48px;display:flex;align-items:center;gap:1vw;padding:0 1.2vw;border-radius:12px;background:rgba(255,255,255,.07);border-bottom:2px dashed rgba(255,255,255,.18);transition:transform .7s cubic-bezier(.2,.8,.2,1);font-size:clamp(1.1rem,2.2vw,2rem)}
.lane .rk{width:2.2em;font-weight:700;color:var(--gold)}.lane .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lane .run{position:absolute;inset-inline-start:0;bottom:0;height:5px;background:var(--gold);border-radius:3px;transition:width .7s}
.lane.up{background:rgba(242,183,5,.28)}.msg{text-align:center;font-size:2.4vw;padding:15vh 2vw;color:#BFE3D5}canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
.tg{background:var(--gold);color:#12263A;border-radius:99px;padding:0 .6em;font-size:.6em}</style></head><body>
<div class=hd><h1 id=t>لوحة المتصدرات</h1><span style="flex:1"></span><button class=btn id=fs>ملء الشاشة</button></div>
<div class=st><span id=fin></span><span id=pl></span></div><div class=podium id=pod></div><div class=lanes id=lanes></div><canvas id=cv></canvas>
<script src="/socket.io/socket.io.js"></script><script>
const code=location.pathname.split('/').pop(),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dur=s=>s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:s+'ث';let prev={},winner=null,H=0;
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
const sock=io();sock.on('connect',()=>sock.emit('watch',code));sock.on('board',draw);
function draw(d){$('t').textContent='لوحة المتصدرات – '+d.title;$('fin').textContent='أنهت المسابقة: '+d.finished;$('pl').textContent='لا تزال تلعب: '+d.playing;
 if(d.hidden){$('pod').innerHTML='';$('lanes').innerHTML='<div class=msg>ستُعلن النتائج بعد قليل…</div>';$('lanes').style.height='auto';return}
 if(!d.rows.length){$('pod').innerHTML='';$('lanes').innerHTML=`<div class=msg>بانتظار المجموعات… رمز الدخول <b style="color:var(--gold)">${d.code}</b></div>`;$('lanes').style.height='auto';return}
 const top=d.rows.filter(r=>r.rank<=3&&(r.score>0||d.rows.length<4)).slice(0,3),order=[2,1,3].map(k=>top.find(r=>r.rank===k)||top.filter(r=>r.rank<=k)[k-1]).filter(Boolean);
 $('pod').innerHTML=[...new Map(order.map(r=>[r.id,r])).values()].map(r=>`<div class="pod p${Math.min(r.rank,3)}"><b>${r.rank===1?'🥇':r.rank===2?'🥈':'🥉'} ${esc(r.name)}${r.tie?' <span class=tg>تعادل</span>':''}</b><div class=sc>${r.score}</div><div>${r.correct} صحيحة · ${dur(r.duration)}</div></div>`).join('');
 const L=$('lanes'),rowH=Math.max(48,innerHeight*.075),gap=8;L.style.height=d.rows.length*(rowH+gap)+'px';
 d.rows.forEach((r,i)=>{let e=document.getElementById('r'+r.id);if(!e){e=document.createElement('div');e.id='r'+r.id;e.className='lane';e.style.transform=`translateY(${i*(rowH+gap)+40}px)`;L.append(e)}
  e.style.height=rowH+'px';e.innerHTML=`<span class=rk>${r.rank}</span><span class=nm>${esc(r.name)}${r.tie?' <span class=tg>تعادل</span>':''}</span><span>${r.score}/${d.totalPoints}</span><span style="opacity:.7">${r.correct}✓</span><span style="opacity:.7">${dur(r.duration)}</span><span>${r.done?'✔':'…'}</span><i class=run style="width:${d.totalPoints?100*r.score/d.totalPoints:0}%"></i>`;
  requestAnimationFrame(()=>e.style.transform=`translateY(${i*(rowH+gap)}px)`);if(prev[r.id]&&prev[r.id]>r.rank){e.classList.add('up');setTimeout(()=>e.classList.remove('up'),1500)}});
 [...L.children].forEach(e=>{if(!d.rows.some(r=>'r'+r.id===e.id)&&e.id)e.remove()});
 prev=Object.fromEntries(d.rows.map(r=>[r.id,r.rank]));
 if(d.playing===0&&d.finished>0&&d.rows[0].score>=0&&winner!==d.rows[0].id+':'+d.rows[0].score){winner=d.rows[0].id+':'+d.rows[0].score;confetti()}}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=$('cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:3+Math.random()*5,r:4+Math.random()*6,c:['#F2B705','#fff','#1FBF8F','#E8643C'][Math.random()*4|0],s:Math.random()*2-1}));let f=0;
 (function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.s*2;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
</script></body></html>
