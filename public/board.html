<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المسابقة – مِضمار</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/webp" href="/midmar-logo.webp">
<style>
:root{color-scheme:dark}
body{background:#09271f;color:#fff;min-height:100vh;overflow-x:hidden}
.hd{display:flex;align-items:center;gap:1em;padding:1em 2vw;border-bottom:1px solid #ffffff20}
.hd h1{margin:0;font-size:clamp(1.4rem,3vw,2.6rem)}
.hd .spacer{flex:1}
.hd .btn{background:#ffffff12;color:#fff;border-color:#ffffff35}
.stats{display:flex;gap:1.5em;padding:.8em 2vw;color:#bfe3d5;font-size:clamp(.95rem,1.5vw,1.3rem);flex-wrap:wrap}
.stage{padding:2vh 2vw 4vh;display:grid;grid-template-columns:minmax(0,1fr);gap:2vw;align-items:start}.stage.has-completed{grid-template-columns:minmax(190px,260px) minmax(0,1fr)}
.qr-card,.results-card{background:#ffffff0c;border:1px solid #ffffff20;border-radius:20px;padding:1.2em}
.qr-card{text-align:center;position:sticky;top:1em}
.qr-card img{display:block;width:min(100%,340px);aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px;padding:10px;margin:.8em auto}
.qr-card.compact img{width:min(100%,150px)}.qr-card.compact{padding:.8em}.qr-card .code{font-size:1.5em;font-weight:700;letter-spacing:.12em;color:#f2b705}
.qr-card p{margin:.25em 0;color:#c6ddd5}
.results-card{min-height:300px}
.waiting{text-align:center;padding:6vh 1em}
.waiting h2{font-size:clamp(1.5rem,3vw,2.8rem);color:#f2b705}
.waiting p{color:#c6ddd5;font-size:1.1rem}
.first{border:1px solid #f2b70570;background:linear-gradient(135deg,#f2b70524,#ffffff08);border-radius:16px;padding:1em;margin-bottom:1em}
.first small{color:#f2b705;font-weight:700}
.first strong{display:block;font-size:clamp(1.5rem,3vw,2.4rem);margin:.25em 0}
.first .time{color:#c6ddd5}
.rank-list{display:grid;gap:.6em}
.progress-wrap{background:#ffffff0c;border:1px solid #ffffff20;border-radius:16px;padding:1em;margin-bottom:1em}.progress-table{border-collapse:collapse;width:100%;min-width:420px;text-align:center}.progress-table th,.progress-table td{padding:.65em;border-bottom:1px solid #ffffff20}.progress-table th:first-child{text-align:right;min-width:130px}.progress-table td{color:#f2b705;font-weight:800}.progress-table td:has(+td){ }
.rank-row{display:flex;align-items:center;gap:.8em;background:#ffffff0c;border:1px solid #ffffff12;border-radius:12px;padding:.75em 1em;font-size:clamp(.95rem,1.5vw,1.25rem)}
.rank-row.top{border-color:#f2b70580;background:#f2b70517}
.rank{width:2em;font-weight:800;color:#f2b705}
.team{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-weight:700;white-space:nowrap}
.meta{color:#b7ccc4;font-size:.88em;white-space:nowrap}
.active{margin-top:1.2em;color:#b7ccc4}
.active summary{cursor:pointer;padding:.5em}
.active-list{display:flex;flex-wrap:wrap;gap:.5em;padding:.5em}
.active-list span{background:#ffffff12;border-radius:99px;padding:.2em .8em}
.brand-mark{margin-inline-start:0;width:46px;height:46px;flex-basis:46px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media(max-width:760px){.stage,.stage.has-completed{grid-template-columns:1fr}.qr-card{position:static;order:0}.results-card{order:1}.qr-card img{width:190px}}
</style>
<style>
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(110deg,#06251e,#0b4735);box-shadow:0 8px 26px #0003;padding:1em 2.2vw}
.hd h1{font-weight:800;letter-spacing:-.035em}
.stats{gap:.65em;padding:1em 2vw}
.stats span{background:#ffffff0b;border:1px solid #ffffff18;border-radius:99px;padding:.35em .85em}
.stage{max-width:1680px;margin:0 auto;padding:1.2em 2vw 3em}
.qr-card,.results-card{background:linear-gradient(145deg,#ffffff12,#ffffff08);border-color:#ffffff24;box-shadow:0 14px 35px #0002;border-radius:22px}
.qr-card h2{font-size:1.2em}
.qr-card img{box-shadow:0 8px 26px #0003}
.results-card{min-height:360px}
.progress-wrap{background:#ffffff0a;border-color:#ffffff22;border-radius:18px}
.progress-table th,.progress-table td{padding:.72em}
.rank-row{border-radius:15px;padding:.9em 1.1em;background:#ffffff0d}
.rank-row.top{border-color:#e7bc3c;background:linear-gradient(110deg,#e4b32c25,#ffffff09)}
.first{border-radius:19px;border-color:#e7bc3c88}
.waiting{padding:7vh 1.2em}
.brand-mark{border:1px solid #ffffff4a;border-radius:13px;background:#ffffff12;overflow:hidden}
.brand-mark img{width:30px;height:30px}
@media(max-width:760px){.hd{padding:.8em 1em}.stats{padding:.7em 1em}.stage{padding:1em}.results-card,.qr-card{border-radius:17px}}
</style></head>
<body class="board-page">
<header class="hd"><img class=board-logo src="/midmar-logo.webp" alt="شعار مِضمار"><h1 id="title">مِضمار – لوحة المسابقة</h1><span class="spacer"></span><button class="btn" id="fs">ملء الشاشة</button><button class="btn theme-toggle" id="themeToggle" type="button">☾ الوضع المظلم</button><span class="brand-mark" title="حقوق إنتريت" aria-label="حقوق إنتريت"><img src="/entrit-logo.svg" alt="إنتريت"></span></header>
<div class="stats"><span id="joined">الفرق المشاركة: 0</span><span id="finished">أنهت المسابقة: 0</span><span id="playing">تلعب الآن: 0</span></div>
<main class="stage">
<aside class="qr-card" id="qr-card"><h2>امسح رمز QR للانضمام</h2><img id="qr" alt="رمز الانضمام"><div class="code" id="code"></div><p>افتح كاميرا الجوال وامسح الرمز</p><p id="join-url" style="font-size:.8em;overflow-wrap:anywhere"></p></aside>
<section class="results-card" id="results"><div class="waiting"><h2>بانتظار الفرق</h2><p>امسحوا رمز QR للانضمام إلى المسابقة</p></div></section>
</main><canvas id="confetti"></canvas>

<script>
const code=location.pathname.split('/').pop(),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const duration=s=>{s=Math.max(0,Number(s)||0);return s>=60?Math.floor(s/60)+'د '+String(s%60).padStart(2,'0')+'ث':s+'ث'};
const joinUrl=location.origin+'/j/'+encodeURIComponent(code);
$('qr').src='/api/qr?text='+encodeURIComponent(joinUrl);$('code').textContent=code;$('join-url').textContent=joinUrl;
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
const THEME_KEY='midmar-theme';
function setBoardTheme(theme,save=true){const next=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=next;if(save)localStorage.setItem(THEME_KEY,next);const b=$('themeToggle');if(b){b.innerHTML=next==='dark'?'☀ الوضع الساطع':'☾ الوضع المظلم';b.setAttribute('aria-label',next==='dark'?'التبديل إلى الوضع الساطع':'التبديل إلى الوضع المظلم')}}
setBoardTheme(localStorage.getItem(THEME_KEY)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),false);
$('themeToggle').onclick=()=>setBoardTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
let boardRefreshTimer=null;
async function refreshBoard(){try{const r=await fetch('/api/board/'+encodeURIComponent(code),{cache:'no-store'});if(!r.ok)return;const d=await r.json();const signature=JSON.stringify(d);if(signature!==window.lastBoardSignature){window.lastBoardSignature=signature;draw(d)}}catch(e){console.warn('تعذر تحديث اللوحة',e)}}
refreshBoard();boardRefreshTimer=setInterval(refreshBoard,1200);
let announced=null;
function progressMatrix(d){if(!d.rows?.length)return '<div class="waiting"><p>لا يوجد مشاركون حتى الآن.</p></div>';const qs=d.questions||[];return `<div class="progress-wrap"><h2>متابعة تقدم المشاركين</h2><div style="overflow:auto"><table class="progress-table"><thead><tr><th>المشارك</th>${qs.map((q,i)=>`<th>س${i+1}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr><th>${esc(r.name)}</th>${(r.progress||[]).map(p=>`<td title="${p.status==='done'?'مكتمل':p.status==='active'?'قيد التنفيذ':'لم يبدأ'}">${p.status==='done'?'✓':p.status==='active'?'◉':'·'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="meta">✓ مكتمل · ◉ قيد التنفيذ · · لم يبدأ</p></div>`}
function draw(d){
 $('title').textContent='مِضمار – '+d.title;
 $('joined').textContent='الفرق المشاركة: '+(d.rows?.length||0);
 $('finished').textContent='أنهت المسابقة: '+d.finished;
 $('playing').textContent='تلعب الآن: '+d.playing;
 const completed=(d.rows||[]).filter(r=>r.done).sort((a,b)=>b.score-a.score||a.duration-b.duration||a.id-b.id);
 const active=(d.rows||[]).filter(r=>!r.done);
 const qr=$('qr-card'),stage=document.querySelector('.stage');
 if(!completed.length){
  stage.classList.remove('has-completed');qr.classList.remove('compact');
  $('results').innerHTML=progressMatrix(d)+'<div class="waiting"><h2>بانتظار اكتمال المشاركين</h2><p>تظهر حالة الإجابة لكل مشارك مباشرة عند إرسالها.</p><p>المشاركون: <b>'+((d.rows||[]).length)+'</b></p></div>';
  return;
 }
 stage.classList.add('has-completed');qr.classList.add('compact');
 if(d.hidden){$('results').innerHTML=progressMatrix(d)+'<div class="waiting"><h2>الترتيب مخفي مؤقتًا</h2><p>متابعة تقدم المشاركين ما زالت ظاهرة.</p></div>';return;}
 const first=[...completed].sort((a,b)=>(a.finishedAt||Number.MAX_SAFE_INTEGER)-(b.finishedAt||Number.MAX_SAFE_INTEGER))[0]||completed[0];
 const rows=completed.map((r,i)=>'<div class="rank-row '+(i===0?'top':'')+'"><span class="rank">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1))+'</span><span class="team">'+esc(r.name)+'</span><span class="score">'+r.score+'/'+d.totalPoints+'</span><span class="meta">'+duration(r.duration)+'</span></div>').join('');
 const activeHtml=active.length?'<details class="active"><summary>فرق لم تنه الإجابة بعد ('+active.length+')</summary><div class="active-list">'+active.map(r=>'<span>'+esc(r.name)+'</span>').join('')+'</div></details>':'';
 $('results').innerHTML=progressMatrix(d)+'<div class="first"><small>اكتمل المشارك الأول</small><strong>'+esc(first.name)+'</strong><span class="time">الدرجة '+first.score+'/'+d.totalPoints+' · الزمن '+duration(first.duration)+'</span></div><h2>ترتيب الفرق المكتملة</h2><div class="rank-list">'+rows+'</div>'+activeHtml;
 const signature=first.id+':'+first.score+':'+first.duration;
 if(active.length===0&&announced!==signature){announced=signature;confetti()}
}
function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=$('confetti'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const colors=['#f2b705','#fff','#1fbf8f','#e8643c'];
 const parts=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,v:2+Math.random()*4,r:4+Math.random()*6,color:colors[Math.random()*colors.length]}));
 let frame=0;(function animate(){ctx.clearRect(0,0,c.width,c.height);for(const p of parts){p.y+=p.v;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r*1.6)}if(++frame<180)requestAnimationFrame(animate);else ctx.clearRect(0,0,c.width,c.height)})();
}
</script></body></html>
