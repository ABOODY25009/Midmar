<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مِضمار</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/webp" href="/midmar-logo.webp">
<style>body{-webkit-user-select:none;user-select:none}.top{background:var(--g2);color:#fff;padding:.6em 1em}.top .bar{background:rgba(255,255,255,.25)}.top .bar i{background:var(--gold)}
.choice{display:block;width:100%;text-align:right;font-size:1.15em;padding:.9em 1em;margin:.5em 0;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;min-height:56px}
.choice.sel{border-color:var(--g);background:rgba(14,124,90,.12)}.choice.right{border-color:var(--ok);background:rgba(30,142,90,.2)}.choice.wrong{border-color:var(--red);background:rgba(194,58,58,.15)}
.big{font-size:3em;font-weight:700;line-height:1.1}.fb{padding:.6em 1em;border-radius:10px;margin:.6em 0;font-weight:700}.fb.ok{background:rgba(30,142,90,.2)}.fb.no{background:rgba(194,58,58,.15)}</style>
<style>
body{background:linear-gradient(145deg,#edf5f1,#f7f9f8 55%,#eef4f1);color:#1b3037}
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:6;background:linear-gradient(115deg,#075b49,#0b8667);box-shadow:0 8px 28px #073c2d28;padding:.8em max(1em,calc((100vw - 760px)/2))}
.top .row{gap:.8em}
.top b{font-size:1.08em;letter-spacing:-.02em}
.top .bar{height:7px;border-radius:99px;background:#ffffff35}
.top .bar i{border-radius:99px;background:#f2c44c}
.wrap{max-width:760px;padding:1.5em 1.1em 3em}
.wrap>h2{margin:.3em 0 1em;padding:1.15em 1.25em;background:#fff;border:1px solid #dce8e3;border-radius:18px;box-shadow:0 8px 26px #153d2d0c;font-size:clamp(1.2rem,3vw,1.7rem);line-height:1.65}
.choice{border-radius:15px;border:1.5px solid #d9e5df;background:#fff;min-height:58px;padding:1em 1.1em;margin:.7em 0;font-weight:650;box-shadow:0 3px 12px #183d2b08;transition:transform .15s,border-color .15s,background .15s}
.choice:hover{border-color:#8db9a7;transform:translateY(-1px)}
.choice.sel{border-color:#0e8765;background:#e8f5ef;box-shadow:0 0 0 3px #0e87651a}
.choice.right{border-color:#16855d;background:#e5f6ee}
.choice.wrong{border-color:#bd4952;background:#fff0f1}
#ok{min-height:52px;border-radius:15px;margin-top:1em;font-weight:750;box-shadow:0 8px 22px #087f6322}
#ok:disabled{opacity:.55;box-shadow:none}
.fb{border-radius:13px;padding:.8em 1em}
.card.narrow{border-radius:22px;border-color:#d9e6e0;box-shadow:0 18px 50px #153e3016}
.card.narrow h1{color:#0a7157}
.tag{margin:.35em 0}
@media(max-width:560px){.top{padding:.7em .85em}.wrap{padding:1em .8em 2em}.wrap>h2{padding:.95em}.choice{font-size:1.02em}}
</style></head><body class="player-page"><div id=app></div>
<script>
const code=location.pathname.split('/').pop(),KEY='mid_'+code,app=document.getElementById('app');let token=localStorage.getItem(KEY),S=null,sel=null,orderSel=[],busy=false,timer=null,waitTimer=null,off=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const THEME_KEY='midmar-theme';
function setPlayerTheme(theme,save=true){const next=theme==='dark'?'dark':'light';document.documentElement.dataset.theme=next;if(save)localStorage.setItem(THEME_KEY,next);const b=document.getElementById('playerThemeToggle');if(b){b.textContent=next==='dark'?'☀ الوضع الساطع':'☾ الوضع المظلم';b.setAttribute('aria-label',next==='dark'?'التبديل إلى الوضع الساطع':'التبديل إلى الوضع المظلم')}}
setPlayerTheme(localStorage.getItem(THEME_KEY)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),false);
const playerThemeButton=document.createElement('button');playerThemeButton.id='playerThemeToggle';playerThemeButton.className='floating-theme-toggle';playerThemeButton.type='button';playerThemeButton.onclick=()=>setPlayerTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.body.append(playerThemeButton);

async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=Error(j.error||'حدث خطأ');e.data=j;throw e}return j}
async function start(){if(token){try{S=await api('/api/play/'+token);off=S.now-Date.now();return game()}catch(e){localStorage.removeItem(KEY);token=null}}
 try{const i=await api('/api/join/'+code);intro(i)}catch(e){app.innerHTML=`<div class=center><div class="card narrow"><h2>تعذّر فتح المسابقة</h2><p>${esc(e.message)}</p></div></div>`}}
function intro(i){const student=i.participation_mode==='students',roster=i.roster||[];app.innerHTML=`<div class=center><div class="card narrow player-join-card"><img class=player-brand src="/midmar-logo.webp" alt="شعار مِضمار"><h1>${esc(i.title)}</h1>${i.image?`<img src="${i.image}" alt="" style="max-width:100%;border-radius:10px">`:''}<p>${esc(i.description)}</p>
 <p class=tag>${i.nq} سؤال${i.time_limit?` · ${i.time_limit} دقيقة`:''}</p><p>${student?'مشاركة فردية – كل طالب يشارك من جهازه.':'مشاركة جماعية – جوال واحد لكل مجموعة.'}</p>
 ${i.status==='open'?`${student&&i.entry_mode!=='qr'&&roster.length?`<label for=roster>اختر اسمك من قائمة المعلم</label><select id=roster><option value="">اختيار الاسم</option>${roster.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`:''}${!student||i.entry_mode!=='roster'?`<label for=n>${student?'اسم الطالب':'اسم المجموعة'}</label><input id=n maxlength=40 autocomplete=off>`:''}<p class=err id=e></p><button class="btn p" id=go style="width:100%;justify-content:center">${student?'ابدأ المشاركة':'ابدئي المسابقة'}</button>`:`<p class=err>المسابقة ${esc(i.status)}</p>`}</div></div>`;
 const go=document.getElementById('go');if(go)go.onclick=async()=>{go.disabled=true;try{const payload={name:document.getElementById('n')?.value,roster_id:document.getElementById('roster')?.value};const r=await api('/api/join/'+code,'POST',payload);token=r.token;localStorage.setItem(KEY,token);S=await api('/api/play/'+token);off=S.now-Date.now();game()}catch(e){document.getElementById('e').textContent=e.message;go.disabled=false}}}
function game(){clearInterval(timer);clearInterval(waitTimer);if(S.done)return end();if(S.waiting){app.innerHTML=`<div class=center><div class="card narrow" style="text-align:center"><h2>بانتظار المعلم</h2><p>أكملت السؤال المتاح. سيظهر السؤال التالي هنا عند فتحه من لوحة المعلم.</p><div class=tag>لا تغلق الصفحة</div></div></div>`;waitTimer=setInterval(async()=>{try{S=await api('/api/play/'+token);off=S.now-Date.now();if(!S.waiting)game()}catch(e){}},1500);return}sel=null;busy=false;const q=S.question;orderSel=q.type==='order'?q.options.map(x=>x.i).sort(()=>Math.random()-.5):[];
 app.innerHTML=`<div class=top><div class=row><img class=game-logo src="/midmar-logo.webp" alt="مِضمار"><b>${esc(S.title)}</b><span class=sp></span><span id=tm></span></div><div class=row><small>${esc(S.group)}</small><span class=sp></span><small>سؤال ${S.answered+1} من ${S.total}</small></div><div class=bar style="margin-top:.4em"><i style="width:${100*S.answered/S.total}%"></i></div></div>
 <div class=wrap style="max-width:640px"><h2 style="margin-top:.8em">${esc(q.text)}</h2>${q.image?`<img src="${q.image}" alt="" style="max-width:100%;border-radius:10px">`:''}<div id=ch>${q.type==='order'?orderSel.map((n,i)=>`<div class=choice style="display:flex;align-items:center;gap:.5em"><b>${i+1}.</b><span class=sp>${esc(q.options.find(x=>x.i===n).t)}</span><button class="btn s" data-move="up" data-pos=${i} ${i===0?'disabled':''}>↑</button><button class="btn s" data-move="down" data-pos=${i} ${i===orderSel.length-1?'disabled':''}>↓</button></div>`).join(''):` ${q.options.map(o=>`<button class=choice data-i=${o.i}>${esc(o.t)}</button>`).join('')}`}</div><div id=fb></div>
 <button class="btn p" id=ok disabled style="width:100%;justify-content:center;font-size:1.1em">تأكيد الإجابة</button></div>`;
 if(S.progression_mode==='free'){api('/api/play/'+token+'/questions').then(d=>{const nav=document.createElement('div');nav.className='card';nav.style.cssText='display:flex;gap:.4em;flex-wrap:wrap;margin:1em 0';nav.innerHTML='<b style="width:100%">اختر السؤال:</b>'+d.questions.map(q=>`<button class="btn ${q.answered?'s':'p'}" ${q.answered?'disabled':''} data-q="${q.id}">سؤال ${q.index}</button>`).join('');app.querySelector('.wrap').prepend(nav);nav.onclick=async e=>{const btn=e.target.closest('[data-q]');if(!btn)return;try{S=await api('/api/play/'+token+'?question_id='+btn.dataset.q);game()}catch(err){console.warn(err)}}}).catch(()=>{})}
 document.getElementById('ch').onclick=e=>{if(busy)return;const mv=e.target.closest('[data-move]');if(mv){const p=+mv.dataset.pos,to=mv.dataset.move==='up'?p-1:p+1;if(to>=0&&to<orderSel.length){[orderSel[p],orderSel[to]]=[orderSel[to],orderSel[p]];gameOrderDraw(q)}return}const b=e.target.closest('.choice[data-i]');if(!b)return;sel=+b.dataset.i;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('sel',x===b));document.getElementById('ok').disabled=false};
 document.getElementById('ok').onclick=submit;if(q.type==='order'){document.getElementById('ok').disabled=false;window.gameOrderDraw=gameOrderDraw}tick();if(S.deadline)timer=setInterval(tick,500)}
function gameOrderDraw(q){const box=document.getElementById('ch');if(!box)return;box.innerHTML=orderSel.map((n,i)=>`<div class=choice style="display:flex;align-items:center;gap:.5em"><b>${i+1}.</b><span class=sp>${esc(q.options.find(x=>x.i===n).t)}</span><button class="btn s" data-move="up" data-pos=${i} ${i===0?'disabled':''}>↑</button><button class="btn s" data-move="down" data-pos=${i} ${i===orderSel.length-1?'disabled':''}>↓</button></div>`).join('')}
function tick(){if(!S.deadline)return;const t=Math.max(0,Math.ceil((S.deadline-(Date.now()+off))/1000)),el=document.getElementById('tm');if(el)el.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
 if(t<=0){clearInterval(timer);api('/api/play/'+token).then(s=>{S=s;if(s.done)end()})}}
async function submit(){if(sel===null||busy)return;busy=true;const btn=document.getElementById('ok');btn.disabled=true;
 try{const r=await api('/api/play/'+token+'/answer','POST',S.question.type==='order'?{question_id:S.question.id,order:orderSel}:{question_id:S.question.id,choice:sel});S=r.state;
  if(r.correct===null)return game();if(S.question?.type!=='order')document.querySelectorAll('.choice[data-i]').forEach(x=>{const i=+x.dataset.i;if(i===r.right)x.classList.add('right');else if(i===sel)x.classList.add('wrong')});
  document.getElementById('fb').innerHTML=`<div class="fb ${r.correct?'ok':'no'}">${r.correct?'إجابة صحيحة!':'إجابة خاطئة'}</div>`;btn.textContent='السؤال التالي';btn.disabled=false;btn.onclick=game}
 catch(e){if(e.data?.state){S=e.data.state;return game()}busy=false;btn.disabled=false;document.getElementById('fb').innerHTML=`<p class=err>${esc(e.message)}</p>`}}
function end(){clearInterval(timer);const m=Math.floor(S.duration/60),s=S.duration%60;app.innerHTML=`<div class=center><div class="card narrow" style="text-align:center"><h1>انتهت المسابقة</h1><p>${esc(S.group)}</p><div class=big>${S.score}<small style="font-size:.4em;color:var(--mut)"> / ${S.totalPoints}</small></div>
 <p>${S.correct} إجابة صحيحة من ${S.total} · الوقت ${m}د ${s}ث</p>${S.rank?`<p class=tag>مركزكم الحالي: ${S.rank}</p>`:''}<p>تابعي لوحة المتصدرات على شاشة الفصل.</p>${S.retry?'<button class="btn p" id=rt>إعادة المحاولة</button>':''}</div></div>`;
 const r=document.getElementById('rt');if(r)r.onclick=async()=>{await api('/api/play/'+token+'/retry','POST');S=await api('/api/play/'+token);off=S.now-Date.now();game()}}
start();
</script></body></html>
