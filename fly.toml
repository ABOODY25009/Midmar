app = "midmar-CHANGE-ME"
primary_region = "fra"
[build]
[env]
  NODE_ENV = "production"
  DB_PATH = "/data/midmar.db"
  PORT = "3000"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[mounts]
  source = "data"
  destination = "/data"
